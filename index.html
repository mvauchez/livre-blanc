<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Livre Blanc - Téléchargez maintenant</title>
<link rel="icon" type="image/png" href="Images/Logo Favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=League+Spartan:wght@700;800&family=Open+Sans:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg-cream: #faf9f7;
    --bg-green: #d8e5d1;
    --text-dark: #1a1a1a;

    /* Cartes propriétés (--card-w et --card-h recalculées en JS) */
    --card-w: 160px;
    --card-h: 207px;
    --card-ratio: 1004 / 1299;
    --card-gap: 26px;       /* espace fixe entre deux cartes (plus grand) */
    --card-back-offset: 0.05; /* décalage de la carte jumelle (haut-gauche) */
    --card-shift: 40px;     /* portion cachée au repos (fixe, en px) */
    --card-lift: 140px;     /* remontée au survol (recalculée en JS selon la taille de carte) */
    --ease-slide: cubic-bezier(.4, 0, .2, 1);
  }

  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  html, body {
    height: 100%;
    overflow: hidden;
  }

  body {
    font-family: 'Open Sans', sans-serif;
    color: var(--text-dark);
    background-color: var(--bg-cream);
  }

  .page {
    height: 100vh;
    height: 100svh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  /* Bande 1 : blanche, en-tête (logo entreprise + navigation) */
  .band-white-top {
    flex: 0 0 10vh;
    min-height: 0;
    background-color: var(--bg-cream);
    display: flex;
    align-items: center;
    z-index: 2;
    position: relative;
  }

  .header-bar {
    width: 100%;
    max-width: 1600px;
    margin: 0 auto;
    padding: 0 clamp(20px, 4vw, 40px);
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 20px;
  }

  .brand-logo {
    display: flex;
    align-items: center;
    min-width: 0;
  }

  .brand-logo img {
    height: clamp(24px, 5vh, 44px);
    width: auto;
    display: block;
  }

  /* Placeholder tant que le logo entreprise n'est pas fourni */
  .brand-logo-placeholder {
    border: 1px dashed #b8b8b0;
    border-radius: 4px;
    padding: 6px 14px;
    font-size: clamp(0.65rem, 1.4vh, 0.8rem);
    color: #8a8a80;
    white-space: nowrap;
  }

  .top-nav {
    display: flex;
    align-items: center;
    justify-content: flex-end;
    gap: clamp(18px, 3vw, 40px);
    margin-left: auto;
  }

  .top-nav a {
    font-family: 'Open Sans', sans-serif;
    font-weight: 600;
    font-size: clamp(0.85rem, 1.9vh, 1.1rem);
    text-transform: uppercase;
    letter-spacing: 0.03em;
    color: var(--text-dark);
    text-decoration: none;
    white-space: nowrap;
  }

  .top-nav a:hover {
    opacity: 0.65;
  }

  /* Bouton menu : masqué par défaut, visible uniquement sur téléphone */
  .menu-toggle {
    display: none;
    background: none;
    border: none;
    cursor: pointer;
    padding: 6px;
    margin-left: auto;
    line-height: 0;
  }

  .menu-toggle img {
    height: clamp(20px, 4vh, 30px);
    width: auto;
    display: block;
  }

  /* Bande 2 : verte, titre + sous-titre + bouton + logo */
  .hero-section {
    flex: 0 0 57vh;
    min-height: 0;
    background-color: var(--bg-green);
    position: relative;
    z-index: 3;
    overflow: visible;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 0 clamp(16px, 4vw, 40px);
    min-width: 0;
  }

  .hero-container {
    width: 100%;
    height: 100%;
    max-width: 1200px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: clamp(12px, 3vw, 60px);
    margin: 0 auto;
    min-width: 0;
    min-height: 0;
  }

  .logo-wrapper {
    flex: 1.1 1 0;
    height: 100%;
    min-height: 0;
    display: flex;
    justify-content: center;
    align-items: center;
    min-width: 0;
    overflow: visible;
  }

  .logo-wrapper img {
    width: 100%;
    height: 122%;
    object-fit: contain;
  }

  .content-wrapper {
    flex: 1.3 1 0;
    min-width: 0;
    height: 100%;
    max-height: 100%;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    justify-content: center;
  }

  .content-wrapper h1 {
    font-family: 'League Spartan', sans-serif;
    font-weight: 800;
    font-size: clamp(1.1rem, 3vw + 2.6vh, 4.5rem);
    line-height: 1.1;
    margin-bottom: clamp(6px, 1.5vh, 24px);
  }

  .content-wrapper p {
    font-family: 'Open Sans', sans-serif;
    font-weight: 400;
    font-size: clamp(0.7rem, 0.6vw + 0.9vh, 1.05rem);
    line-height: 1.5;
    max-width: 480px;
    margin-bottom: clamp(8px, 2vh, 32px);
  }

  .btn-download {
    display: inline-block;
    align-self: flex-start;
    font-family: 'Open Sans', sans-serif;
    font-weight: 600;
    font-size: clamp(0.75rem, 0.9vh + 0.4vw, 1rem);
    background-color: #ffffff;
    color: var(--text-dark);
    text-decoration: none;
    border: none;
    padding: clamp(8px, 1.8vh, 18px) clamp(16px, 3vw, 36px);
    cursor: pointer;
    box-shadow: 0 2px 6px rgba(0, 0, 0, 0.08);
    white-space: nowrap;
  }

  .btn-download:hover {
    background-color: #f0f0f0;
  }

  /* Bande 3 : blanche, vide */
  .band-white-mid {
    flex: 0 0 15vh;
    min-height: 0;
    background-color: var(--bg-cream);
  }

  /* Bande 4 : verte, flèches de navigation + carrousel de propriétés */
  .nav-section {
    flex: 0 0 18vh;
    min-height: 0;
    background-color: var(--bg-green);
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 60px;
    position: relative;
    z-index: 4;
  }

  .nav-section::before {
    content: '';
    position: absolute;
    inset: 0;
    background: #000;
    opacity: 0;
    pointer-events: none;
    transition: opacity .35s ease;
  }

  .page:has(.card.is-active) .nav-section::before {
    opacity: 0.08;
  }

  .cards-viewport {
    position: relative;
    flex: 1 1 auto;
    height: 100%;
    align-self: stretch;
    clip-path: inset(-2000px 0px -2000px 0px);
    z-index: 1;
  }

  .nav-arrow {
    background: none;
    border: none;
    cursor: pointer;
    color: var(--text-dark);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 8px;
    position: relative;
    z-index: 5;
    flex: 0 0 auto;
  }

  .nav-arrow svg {
    width: 28px;
    height: 28px;
  }

  .nav-arrow:disabled {
    opacity: 0.3;
    cursor: default;
  }

  .cards-track {
    position: absolute;
    top: 0;
    left: 0;
    display: flex;
    align-items: flex-start;
    gap: var(--card-gap);
    transition: transform .5s var(--ease-slide);
    will-change: transform;
  }

  .cards-track.no-transition {
    transition: none !important;
  }

  .card {
    position: relative;
    flex: 0 0 auto;
    width: var(--card-w);
    /* Zone de survol statique : englobe à la fois la position au repos
       et la position surélevée, pour qu'elle ne se dérobe jamais sous la souris
       une fois la carte relevée (évite tout scintillement pendant la remontée/descente).
       La marge négative compense l'ajout de hauteur pour garder la position
       de repos inchangée (seul le haut de la zone s'étend, pas le bas).
       Au repos, cette zone élargie ne doit rien capter (pointer-events: none)
       pour ne pas bloquer les éléments environnants : seule la carte réellement
       visible (.card-visual, ci-dessous) reste cliquable/survolable tant que
       la carte n'est pas relevée. */
    height: calc(var(--card-h) + var(--card-shift) + var(--card-lift));
    margin-top: calc(var(--card-lift) * -1);
    display: block;
    text-decoration: none;
    pointer-events: none;
  }

  .card-visual {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: var(--card-h);
    transform: translateY(calc(var(--card-shift) + var(--card-lift)));
    transition: transform .4s var(--ease-slide);
    /* Toujours actif : c'est cette zone (la carte réellement visible,
       au repos ou relevée) qui capte le survol initial et le déclenche. */
    pointer-events: auto;
  }

  .card.is-active .card-visual,
  .card:focus-visible .card-visual {
    transform: translateY(0) scale(1.05);
  }

  .card-visual img {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    object-fit: contain;
    display: block;
    pointer-events: none;
  }

  .card-back {
    z-index: 0;
    transform: translate(
      calc(var(--card-w) * var(--card-back-offset) * -1),
      calc(var(--card-w) * var(--card-back-offset) * -1)
    );
    transition: opacity .25s ease;
  }

  .card-front {
    z-index: 1;
    filter: drop-shadow(0 3px 6px rgba(0, 0, 0, 0.18));
  }

  .card.is-active,
  .card:focus-visible {
    z-index: 50;
    /* Une fois relevée, la grande zone statique redevient active pour
       maintenir la carte levée pendant toute l'animation sans scintillement. */
    pointer-events: auto;
  }

  /* La carte dédoublée disparaît quand la carte se soulève */
  .card.is-active .card-back,
  .card:focus-visible .card-back {
    opacity: 0;
  }

  .card.is-active .card-front,
  .card:focus-visible .card-front {
    filter: drop-shadow(0 20px 30px rgba(0, 0, 0, 0.35));
  }

  /* Tout ce qui entoure la carte survolée s'assombrit légèrement (effet discret) */
  .band-white-top,
  .hero-section,
  .band-white-mid,
  .nav-arrow {
    transition: filter .35s ease;
  }

  .page:has(.card.is-active) .band-white-top,
  .page:has(.card.is-active) .hero-section,
  .page:has(.card.is-active) .band-white-mid,
  .page:has(.card.is-active) .nav-arrow {
    filter: brightness(0.85);
  }

  .cards-track:has(.card.is-active) .card:not(.is-active) .card-visual {
    filter: brightness(0.85);
    transition: filter .35s ease;
  }

  @media (max-width: 600px) {
    .hero-section {
      padding: 0 clamp(10px, 3vw, 20px);
    }

    .hero-container {
      gap: clamp(8px, 2vw, 20px);
    }

    .logo-wrapper {
      flex: 1 1 0;
    }

    .content-wrapper {
      flex: 1.5 1 0;
    }

    .nav-section {
      padding: 0 clamp(20px, 6vw, 40px);
    }
  }

  /* Ecrans très bas (mobile en paysage) : on sacrifie le sous-titre
     pour garantir que le titre et le bouton restent visibles */
  @media (max-height: 420px) {
    .content-wrapper p {
      display: none;
    }

    .content-wrapper h1 {
      margin-bottom: clamp(4px, 1vh, 12px);
    }
  }

  /* =====================================================================
     VERSION TÉLÉPHONE — tout ce qui suit ne s'applique qu'en dessous de
     768px de large. L'affichage ordinateur reste strictement inchangé.
     ===================================================================== */
  @media (max-width: 768px) {

    /* --- Hauteur des bandes : le plateau prend beaucoup plus de place --- */
    .band-white-top { flex: 0 0 9vh; z-index: 60; }
    .hero-section   { flex: 0 0 63vh; }
    .band-white-mid { flex: 0 0 3vh; }
    .nav-section    { flex: 0 0 25vh; padding: 0 8px; }

    /* --- En-tête : liens remplacés par l'icône menu --- */
    .header-bar { padding: 0 16px; gap: 12px; }

    .menu-toggle { display: block; }

    .top-nav {
      display: none;
      position: absolute;
      top: 100%;
      right: 16px;
      flex-direction: column;
      align-items: flex-end;
      gap: 0;
      background-color: var(--bg-cream);
      border: 1px solid #e3e1dc;
      box-shadow: 0 6px 18px rgba(0, 0, 0, 0.12);
      padding: 14px 0;
      min-width: 190px;
      z-index: 61;
    }

    .top-nav.is-open { display: flex; }

    .top-nav a {
      display: block;
      width: 100%;
      text-align: right;
      padding: 18px 22px;
      font-size: 0.95rem;
    }

    .top-nav a:active { background-color: #efeee9; }

    /* --- Bloc central : titre, plateau, texte, bouton ---
       display:contents fait remonter h1 / plateau / p / bouton au même
       niveau afin de pouvoir les ordonner verticalement. */
    .hero-section {
      flex-direction: column;
      justify-content: center;
      align-items: stretch;
      padding: 12px 20px 14px;
      gap: 0;
    }

    .hero-container,
    .content-wrapper { display: contents; }

    .content-wrapper h1 {
      order: 1;
      flex: 0 0 auto;
      font-size: clamp(1.1rem, 6.5vw, 1.9rem);
      line-height: 1.1;
      margin-bottom: 6px;
      white-space: nowrap;
    }

    .logo-wrapper {
      order: 2;
      flex: 1 1 auto;
      height: auto;
      min-height: 0;
      width: 100%;
      margin: 0 -10px;
    }

    .logo-wrapper img {
      width: 100%;
      height: 100%;
      max-width: none;
      object-fit: contain;
    }

    .content-wrapper p {
      order: 3;
      flex: 0 0 auto;
      max-width: none;
      font-size: 0.82rem;
      line-height: 1.45;
      margin: 6px 0 10px;
      text-align: justify;
    }

    .btn-download {
      order: 4;
      flex: 0 0 auto;
      align-self: stretch;
      text-align: center;
      padding: 13px 18px;
      font-size: 0.9rem;
      border: 2px solid var(--text-dark);
    }

    /* --- Cartes : 2 visibles, flèches conservées --- */
    .nav-arrow { padding: 4px; }
    .nav-arrow svg { width: 22px; height: 22px; }

    /* Pas d'assombrissement au survol sur téléphone (uniquement au swipe) */
    .cards-track:has(.card.is-active) .card:not(.is-active) .card-visual {
      filter: brightness(0.8);
    }
  }

  /* Écran bas et étroit (téléphone en paysage) : on garde titre + bouton */
  @media (max-width: 768px) and (max-height: 480px) {
    .content-wrapper p { display: none; }
    .band-white-top { flex: 0 0 14vh; }
    .hero-section   { flex: 0 0 59vh; }
    .band-white-mid { flex: 0 0 2vh; }
    .nav-section    { flex: 0 0 25vh; }
  }
</style>
</head>
<body>
  <div class="page">

    <div class="band-white-top">
      <div class="header-bar">
        <div class="brand-logo">
          <img src="Images/HASA Promotion Logo.png" alt="Logo entreprise">
        </div>

        <!-- Icône menu : visible uniquement sur téléphone.
             >>> Remplacer le chemin ci-dessous par celui de ton fichier d'icône <<< -->
        <button class="menu-toggle" id="menuToggle" aria-label="Ouvrir le menu" aria-expanded="false" aria-controls="topNav">
          <img src="Images/Menu.png" alt="">
        </button>

        <nav class="top-nav" id="topNav">
          <a href="réalisations.html">Réalisations</a>
          <a href="contexte.html">Contexte</a>
          <a href="contact.html">Contact</a>
        </nav>
      </div>
    </div>

    <section class="hero-section">
      <div class="hero-container">
        <div class="logo-wrapper">
          <img src="Images/Plateau.png" alt="HASA Promotion Plateau">
        </div>
        <div class="content-wrapper">
          <h1>Jouez. Explorez. Investissez.</h1>
          <p>Une aventure née sur le terrain, devenue un livre blanc. Explorez les codes de la gamification, ses opportunités et son potentiel pour réinventer la communication immobilière.</p>
          <a class="btn-download" href="questionnaire.html">Téléchargez le livre blanc</a>
        </div>
      </div>
    </section>

    <div class="band-white-mid"></div>

    <nav class="nav-section">
      <button class="nav-arrow" id="navPrev" aria-label="Propriété précédente">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="15 18 9 12 15 6"></polyline>
        </svg>
      </button>

      <div class="cards-viewport">
        <div class="cards-track" id="cardsTrack"></div>
      </div>

      <button class="nav-arrow" id="navNext" aria-label="Propriété suivante">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="9 18 15 12 9 6"></polyline>
        </svg>
      </button>
    </nav>

  </div>

  <script>
    // --- Liste des propriétés (ordre d'affichage identique au modèle) ---
    const PROPERTIES = [
      { slug: 'rue-de-metz',       img: 'Images/Propriété_2b.png', alt: 'À vendre — Rue de Metz' },
      // { slug: 'rue-tolosane',      img: 'Images/Propriété_3b.png', alt: 'À vendre — Rue Tolosane' },
      { slug: 'avenue-lagarde',      img: 'Images/Propriété_7b.png', alt: 'À vendre — Avenue Lagarde' },
      { slug: 'rue-mage',          img: 'Images/Propriété_6b.png', alt: 'À vendre — Rue Mage' },
      { slug: 'impasse-ampere',    img: 'Images/Propriété_5b.png', alt: 'À vendre — Impasse Ampère' },
      { slug: 'rue-cany',          img: 'Images/Propriété_4b.png', alt: 'À vendre — Rue Cany' },
      { slug: 'rue-croix-baragnon',img: 'Images/Propriété_1b.png', alt: 'À vendre — Rue Croix Baragnon' }
      ];

    // --- Détection du mode téléphone (même seuil que la media query CSS) ---
    const MOBILE_MQ = window.matchMedia('(max-width: 768px)');
    const CAN_HOVER = window.matchMedia('(hover: hover)').matches;
    const isMobile = () => MOBILE_MQ.matches;

    // Réglages qui diffèrent entre ordinateur et téléphone
    let VISIBLE_COUNT = isMobile() ? 2 : 4;   // cartes visibles
    let WINDOW_SIZE   = VISIBLE_COUNT + 2;    // 1 carte tampon de chaque côté (boucle infinie)
    let CARD_GAP      = isMobile() ? 16 : 26; // doit rester synchronisé avec --card-gap
    let LIFT_RATIO    = isMobile() ? 0.75 : 0.62; // remontée = % de la hauteur de carte

    const track = document.getElementById('cardsTrack');
    const btnPrev = document.getElementById('navPrev');
    const btnNext = document.getElementById('navNext');

    let startIndex = 0; // index (dans PROPERTIES) de la 1ère carte visible
    let cardEls = [];
    let step = 0;        // largeur d'une carte + chevauchement, mesurée en pixels
    let isAnimating = false;

    function mod(n, m) {
      return ((n % m) + m) % m;
    }

    function closeAllCards() {
      cardEls.forEach(c => c.classList.remove('is-active'));
    }

    // Construit les éléments <a> (recyclés à chaque glissement)
    function buildCards() {
      track.innerHTML = '';
      cardEls = [];
      for (let i = 0; i < WINDOW_SIZE; i++) {
        const card = document.createElement('a');
        card.className = 'card';
        card.innerHTML = '<span class="card-visual">' +
                            '<img class="card-back" src="" alt="">' +
                            '<img class="card-front" src="" alt="">' +
                          '</span>';
        track.appendChild(card);
        cardEls.push(card);

        const visual = card.querySelector('.card-visual');

        // Ordinateur uniquement : ne se lève que si la souris passe réellement sur
        // la carte visible (et non sur la zone vide réservée à la remontée, au repos).
        // Le test isMobile() est refait à chaque événement : ainsi, en fenêtre étroite
        // (mode téléphone), le survol ni le clic ne relèvent la carte.
        visual.addEventListener('mouseenter', () => {
          if (isMobile() || !CAN_HOVER) return;
          card.classList.add('is-active');
        });

        // Ne redescend que quand la souris quitte entièrement la zone
        // (repos + surélevée) : évite qu'elle ne se lève/couche en boucle
        card.addEventListener('mouseleave', () => {
          if (isMobile() || !CAN_HOVER) return;
          card.classList.remove('is-active');
        });

        // Téléphone : un appui sur la carte couchée la relève ; un second appui
        // sur la carte relevée ouvre la page de la propriété.
        card.addEventListener('click', (e) => {
          if (card.classList.contains('is-active')) return; // carte relevée : on laisse le lien s'ouvrir
          // Au repos, l'appui ne doit jamais rediriger vers la propriété
          e.preventDefault();
          if (isMobile()) {
            closeAllCards();
            card.classList.add('is-active');
          }
        });
      }
    }

    // Remplit les cartes avec les bonnes images selon la fenêtre courante
    function fillCards() {
      for (let i = 0; i < WINDOW_SIZE; i++) {
        const propIndex = mod(startIndex - 1 + i, PROPERTIES.length);
        const prop = PROPERTIES[propIndex];
        const card = cardEls[i];
        card.href = 'propriete.html?propriete=' + prop.slug;
        card.querySelector('.card-back').src = prop.img;
        card.querySelector('.card-front').src = prop.img;
        card.querySelector('.card-front').alt = prop.alt;
        card.style.zIndex = 10 + i;
        card.classList.remove('is-active');
      }
    }

    const viewport = document.querySelector('.cards-viewport');
    const SAFETY_MARGIN = 1; // évite qu'un arrondi ne laisse dépasser une carte supplémentaire
    const CARD_RATIO = 1299 / 1004; // hauteur / largeur

    // Calcule la largeur (et la hauteur/remontée) de carte nécessaire pour que les cartes visibles
    // (espacées de CARD_GAP) occupent toute la largeur disponible, sans déborder
    function computeCardWidth() {
      const available = viewport.clientWidth - SAFETY_MARGIN;
      const w = (available - (VISIBLE_COUNT - 1) * CARD_GAP) / VISIBLE_COUNT;
      const width = Math.floor(w);
      const height = Math.round(width * CARD_RATIO);
      document.documentElement.style.setProperty('--card-w', width + 'px');
      document.documentElement.style.setProperty('--card-h', height + 'px');
      document.documentElement.style.setProperty('--card-lift', Math.round(height * LIFT_RATIO) + 'px');
    }

    // Mesure la distance réelle (largeur + espacement) entre deux cartes voisines
    function measureStep() {
      if (cardEls.length < 3) return;
      computeCardWidth();
      // relit la position après application de la nouvelle largeur
      step = cardEls[2].offsetLeft - cardEls[1].offsetLeft;
      positionTrack(false);
    }

    // Place le track à sa position de repos (1ère carte visible = position 1)
    function positionTrack(animate) {
      track.classList.toggle('no-transition', !animate);
      track.style.transform = 'translateX(' + (-step) + 'px)';
    }

    // Applique le mode courant (4 cartes ordinateur / 2 cartes téléphone)
    function applyMode() {
      const wanted = isMobile() ? 2 : 4;
      if (wanted !== VISIBLE_COUNT || cardEls.length === 0) {
        VISIBLE_COUNT = wanted;
        WINDOW_SIZE = VISIBLE_COUNT + 2;
        CARD_GAP = isMobile() ? 16 : 26;
        LIFT_RATIO = isMobile() ? 0.75 : 0.62;
        document.documentElement.style.setProperty('--card-gap', CARD_GAP + 'px');
        startIndex = 0;
        buildCards();
        fillCards();
      }
      measureStep();
    }

    function slide(direction) {
      if (isAnimating || step === 0) return;
      isAnimating = true;
      closeAllCards();

      track.classList.remove('no-transition');
      track.style.transform = 'translateX(' + (-step - direction * step) + 'px)';

      const onEnd = () => {
        track.removeEventListener('transitionend', onEnd);
        startIndex = mod(startIndex + direction, PROPERTIES.length);
        fillCards();
        positionTrack(false); // retour instantané à la position de repos
        // force le recalcul du style avant de réautoriser une transition
        void track.offsetWidth;
        isAnimating = false;
      };
      track.addEventListener('transitionend', onEnd);
    }

    btnPrev.addEventListener('click', () => slide(-1));
    btnNext.addEventListener('click', () => slide(1));

    // Un appui en dehors des cartes les recouche
    // (l'appui sur une carte est géré par son propre gestionnaire de clic)
    document.addEventListener('pointerdown', (e) => {
      if (e.target.closest('.card')) return;
      closeAllCards();
    });

    // --- Menu téléphone ---
    const menuToggle = document.getElementById('menuToggle');
    const topNav = document.getElementById('topNav');

    menuToggle.addEventListener('click', (e) => {
      e.stopPropagation();
      const open = topNav.classList.toggle('is-open');
      menuToggle.setAttribute('aria-expanded', open ? 'true' : 'false');
      menuToggle.setAttribute('aria-label', open ? 'Fermer le menu' : 'Ouvrir le menu');
    });

    // Un appui ailleurs referme le menu
    document.addEventListener('pointerdown', (e) => {
      if (!e.target.closest('#topNav') && !e.target.closest('#menuToggle')) {
        topNav.classList.remove('is-open');
        menuToggle.setAttribute('aria-expanded', 'false');
        menuToggle.setAttribute('aria-label', 'Ouvrir le menu');
      }
    });

    window.addEventListener('resize', () => {
      applyMode();
    });

    applyMode();
    requestAnimationFrame(measureStep);
  </script>
</body>
</html>
